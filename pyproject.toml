[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsdataprep"
version = "0.1.0"
description = "Production-grade time-series data preparation for XAUUSD: MT5 export to clean Parquet/DuckDB at 9 timeframes."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Seyyid Sahin", email = "seyyidsahin2834@gmail.com" }]
requires-python = ">=3.11"
keywords = ["time-series", "forex", "gold", "xauusd", "parquet", "duckdb", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=14.0,<19.0",
    "duckdb>=0.9,<2.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "matplotlib>=3.8,<4.0",
    "plotly>=5.18,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.8,<2.0",
    "jupyter>=1.0,<2.0",
    "jupytext>=1.16,<2.0",
    "pandas-stubs>=2.1,<3.0",
]

[project.scripts]
tsdataprep = "tsdataprep.cli:app"

[project.urls]
Homepage = "https://github.com/seyyidsahin2834/time-series-data-preparation"
Repository = "https://github.com/seyyidsahin2834/time-series-data-preparation"
Issues = "https://github.com/seyyidsahin2834/time-series-data-preparation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tsdataprep"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
pretty = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
