version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Only accept patch/minor updates for core data libraries to avoid
      # accidental breaking changes in the pipeline output.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyarrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "duckdb"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
