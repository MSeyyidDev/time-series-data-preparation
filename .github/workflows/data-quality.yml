name: Data Quality Check

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Path to the sample CSV fixture (relative to repo root)"
        required: false
        default: "tests/fixtures/sample_m1.csv"

jobs:
  data-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tsdataprep inspect on sample fixture
        run: |
          tsdataprep inspect --input ${{ github.event.inputs.fixture || 'tests/fixtures/sample_m1.csv' }}

      - name: Validate fixture schema with pytest conftest
        run: |
          pytest tests/conftest.py -v --tb=short || true
