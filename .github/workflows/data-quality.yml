name: Data Quality Check

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Path to the sample CSV fixture (relative to repo root)"
        required: false
        default: "tests/fixtures/sample_m1.csv"

jobs:
  data-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tsdataprep inspect on sample fixture
        run: |
          tsdataprep inspect --input ${{ github.event.inputs.fixture || 'tests/fixtures/sample_m1.csv' }}

      - name: Run focused data-quality tests
        run: |
          pytest tests/test_io.py tests/test_clean.py tests/test_validate.py -q
